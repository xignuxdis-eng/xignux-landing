<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada — XignuX</title>
  <link rel="icon" href="/xignux-landing/assets/logo-xignux.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f7f9;
      --text: #0b1220;
      --text-soft: #334155;
      --accent: #0056b3;
    }
    html.dark {
      --bg: #0b0c10;
      --bg-soft: #0f1117;
      --text: #e5e7eb;
      --text-soft: #cbd5e1;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .card {
      max-width: 540px;
      width: 100%;
      background: var(--bg-soft);
      border: 1px solid rgba(11, 18, 32, 0.1);
      border-radius: 20px;
      padding: 2.25rem;
      text-align: center;
      box-shadow: 0 12px 32px -12px rgba(11, 18, 32, 0.18);
    }
    .code {
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 900;
      line-height: 1;
      margin: 0 0 0.75rem;
      letter-spacing: -0.04em;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 1.75rem;
      color: var(--text-soft);
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.35rem;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, #006d99 0%, #b30059 100%);
      color: #ffffff;
      box-shadow: 0 10px 24px -10px rgba(11, 18, 32, 0.25);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.35rem;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      color: var(--text);
      border: 2px solid #006d99;
    }
  </style>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>
  <main class="card">
    <p class="code" aria-hidden="true">404</p>
    <h1>No encontramos esa página</h1>
    <p>El enlace puede haber cambiado o no existir. Podés volver al inicio de XignuX o escribirnos por WhatsApp.</p>
    <div class="actions">
      <a class="btn-primary" href="/xignux-landing/">Volver al inicio</a>
      <a class="btn-secondary" href="https://wa.me/5493518192655" target="_blank" rel="noopener noreferrer">WhatsApp</a>
    </div>
  </main>
</body>
</html>
